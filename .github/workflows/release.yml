name: Release

# Push a tag like v0.1.0. This tests, builds the wheel and sdist, builds standalone
# binaries, attaches everything to a GitHub release, then publishes to PyPI through
# trusted publishing (no token stored in the repo).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q

  dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/antigravity_swap/__init__.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: aswap-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: aswap-linux-aarch64
          - os: macos-latest
            asset: aswap-macos-arm64
          - os: windows-latest
            asset: aswap-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          uvx pyinstaller --onefile --name aswap --paths src src/antigravity_swap/__main__.py
          if [ -f dist/aswap.exe ]; then mv dist/aswap.exe "dist/${{ matrix.asset }}"; else mv dist/aswap "dist/${{ matrix.asset }}"; fi
          "dist/${{ matrix.asset }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  github-release:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* install.sh --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antigravity-swap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
